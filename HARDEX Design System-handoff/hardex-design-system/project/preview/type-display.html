<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Display type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-1); padding: 28px; }
  .specimen { font-family: var(--font-display); font-weight: 800; font-size: 96px; line-height: .95; letter-spacing: -0.035em; color: var(--fg-1); text-wrap: balance; }
  .specimen em { font-style: normal; color: var(--hardex-green-500); }
  .meta { display: flex; gap: 18px; margin-top: 22px; font: var(--w-medium) 11px/1 var(--font-mono); color: var(--fg-3); letter-spacing: .04em; }
  .meta b { font-weight: 600; color: var(--fg-1); letter-spacing: 0; }
</style>
</head>
<body>
  <div class="specimen">Build Harder. <em>Last Longer.</em></div>
  <div class="meta">
    <div>FAMILY · <b>Bricolage Grotesque</b></div>
    <div>WEIGHT · <b>800</b></div>
    <div>SIZE · <b>96 / 0.95 / -3.5%</b></div>
    <div>USE · <b>hero, H1, marquee</b></div>
  </div>
</body>
</html>
