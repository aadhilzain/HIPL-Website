<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hero Green</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-1); padding: 20px; }
  .ramp { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
  .swatch { aspect-ratio: 1; border-radius: var(--r-md); display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-shadow: var(--shadow-xs); }
  .swatch .step { font: var(--w-semibold) 11px/1 var(--font-mono); letter-spacing: .04em; }
  .swatch .hex { font: var(--w-medium) 10px/1.3 var(--font-mono); margin-top: 4px; opacity: .75; }
  .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .header .label { font: var(--w-semibold) 12px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--fg-2); }
  .header .note { font: var(--w-medium) 11px/1 var(--font-mono); color: var(--fg-3); }
  .primary-tag { position: absolute; top: 8px; right: 8px; font: var(--w-semibold) 9px/1 var(--font-mono); letter-spacing: .1em; padding: 3px 6px; border-radius: var(--r-pill); background: rgba(255,255,255,.85); color: var(--hardex-green-800); }
  .swatch { position: relative; }
</style>
</head>
<body>
  <div class="header">
    <span class="label">Hero — Green Chemistry</span>
    <span class="note">--hardex-green-{50…900}</span>
  </div>
  <div class="ramp">
    <div class="swatch" style="background:var(--hardex-green-50); color:var(--hardex-green-900)"><div class="step">50</div><div class="hex">ECFDF3</div></div>
    <div class="swatch" style="background:var(--hardex-green-100); color:var(--hardex-green-900)"><div class="step">100</div><div class="hex">D2FAE3</div></div>
    <div class="swatch" style="background:var(--hardex-green-200); color:var(--hardex-green-900)"><div class="step">200</div><div class="hex">A6F2C7</div></div>
    <div class="swatch" style="background:var(--hardex-green-300); color:var(--hardex-green-900)"><div class="step">300</div><div class="hex">6FE5A6</div></div>
    <div class="swatch" style="background:var(--hardex-green-400); color:var(--hardex-green-900)"><div class="step">400</div><div class="hex">2FD180</div></div>
    <div class="swatch" style="background:var(--hardex-green-500); color:#fff"><div class="primary-tag">PRIMARY</div><div class="step">500</div><div class="hex">15C172</div></div>
    <div class="swatch" style="background:var(--hardex-green-600); color:#fff"><div class="step">600</div><div class="hex">0EA160</div></div>
    <div class="swatch" style="background:var(--hardex-green-700); color:#fff"><div class="step">700</div><div class="hex">0E7F4F</div></div>
    <div class="swatch" style="background:var(--hardex-green-800); color:#fff"><div class="step">800</div><div class="hex">0F5E3D</div></div>
    <div class="swatch" style="background:var(--hardex-green-900); color:#fff"><div class="step">900</div><div class="hex">0C3F2A</div></div>
  </div>
</body>
</html>
