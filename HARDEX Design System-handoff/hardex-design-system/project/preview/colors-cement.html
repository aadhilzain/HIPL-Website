<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cement Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-0); padding: 20px; }
  .ramp { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
  .swatch { aspect-ratio: 1; border-radius: var(--r-md); display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-shadow: var(--shadow-xs); }
  .swatch .step { font: var(--w-semibold) 11px/1 var(--font-mono); letter-spacing: .04em; }
  .swatch .hex { font: var(--w-medium) 10px/1.3 var(--font-mono); margin-top: 4px; opacity: .65; }
  .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .header .label { font: var(--w-semibold) 12px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--fg-2); }
  .header .note { font: var(--w-medium) 11px/1 var(--font-mono); color: var(--fg-3); }
</style>
</head>
<body>
  <div class="header">
    <span class="label">Cement — warm neutrals</span>
    <span class="note">slight yellow-green undertone · don't mix cool greys</span>
  </div>
  <div class="ramp">
    <div class="swatch" style="background:var(--hardex-cement-50); color:var(--hardex-cement-900); border:1px solid var(--border-1)"><div class="step">50</div><div class="hex">FBFAF6</div></div>
    <div class="swatch" style="background:var(--hardex-cement-100); color:var(--hardex-cement-900)"><div class="step">100</div><div class="hex">F4F2EB</div></div>
    <div class="swatch" style="background:var(--hardex-cement-200); color:var(--hardex-cement-900)"><div class="step">200</div><div class="hex">E8E4D9</div></div>
    <div class="swatch" style="background:var(--hardex-cement-300); color:var(--hardex-cement-900)"><div class="step">300</div><div class="hex">D6D1C2</div></div>
    <div class="swatch" style="background:var(--hardex-cement-400); color:var(--hardex-cement-900)"><div class="step">400</div><div class="hex">B5AE9C</div></div>
    <div class="swatch" style="background:var(--hardex-cement-500); color:#fff"><div class="step">500</div><div class="hex">8C8676</div></div>
    <div class="swatch" style="background:var(--hardex-cement-600); color:#fff"><div class="step">600</div><div class="hex">5F5B4F</div></div>
    <div class="swatch" style="background:var(--hardex-cement-700); color:#fff"><div class="step">700</div><div class="hex">3D3B33</div></div>
    <div class="swatch" style="background:var(--hardex-cement-800); color:#fff"><div class="step">800</div><div class="hex">24231F</div></div>
    <div class="swatch" style="background:var(--hardex-cement-900); color:#fff"><div class="step">900</div><div class="hex">14130F</div></div>
  </div>
</body>
</html>
