<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mono & Devanagari</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-1); padding: 22px 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  h4 { font: var(--w-semibold) 11px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--fg-2); margin: 0 0 12px 0; }
  .mono-row { font: var(--w-medium) 14px/1.6 var(--font-mono); color: var(--fg-1); letter-spacing: .01em; }
  .mono-row .label { color: var(--fg-3); font-weight: 500; display: inline-block; min-width: 90px; }
  .mono-row .val { color: var(--fg-1); }
  .deva-eyebrow { font: var(--w-semibold) 12px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-2); margin-bottom: 8px; }
  .deva-eyebrow .sep { color: var(--hardex-green-500); margin: 0 6px; }
  .deva-h1 { font: var(--w-bold) 32px/1.15 var(--font-display); letter-spacing: -0.025em; color: var(--fg-1); margin: 0 0 4px 0; }
  .deva-h1-hi { font: 600 26px/1.3 'Hind', system-ui, sans-serif; color: var(--hardex-green-700); }
  .deva-note { font: var(--w-medium) 11px/1.4 var(--font-mono); color: var(--fg-3); margin-top: 10px; letter-spacing: .04em; }
</style>
</head>
<body>
  <div>
    <h4>JetBrains Mono — technical data</h4>
    <div class="mono-row"><span class="label">Product</span><span class="val">HARDEX WP 42</span></div>
    <div class="mono-row"><span class="label">VOC</span><span class="val">&lt; 50 g/L</span></div>
    <div class="mono-row"><span class="label">Coverage</span><span class="val">3–5 sq.m/kg</span></div>
    <div class="mono-row"><span class="label">Pot life</span><span class="val">45 min @ 30°C</span></div>
    <div class="mono-row"><span class="label">Standard</span><span class="val">IS 2645 · ASTM D543</span></div>
  </div>
  <div>
    <h4>Hind — Devanagari co-headlines</h4>
    <div class="deva-eyebrow">CONSTRUCTION CHEMICALS<span class="sep">·</span>EST. 1980</div>
    <div class="deva-h1">Build Harder.</div>
    <div class="deva-h1-hi">मज़बूत निर्माण,<br>लंबा भरोसा.</div>
    <div class="deva-note">⚑ HINDI COPY PENDING NATIVE REVIEW</div>
  </div>
</body>
</html>
