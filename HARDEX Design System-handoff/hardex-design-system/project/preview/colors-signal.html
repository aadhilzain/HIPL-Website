<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signal & Lime</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-1); padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .col { display: grid; grid-template-rows: 1fr 1fr; gap: 6px; }
  .swatch { padding: 14px 16px; border-radius: var(--r-md); display: flex; flex-direction: column; justify-content: space-between; min-height: 92px; box-shadow: var(--shadow-xs); }
  .name { font: var(--w-semibold) 12px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; }
  .hex { font: var(--w-medium) 11px/1 var(--font-mono); opacity: .7; }
  .use { font: var(--w-medium) 11px/1.3 var(--font-body); opacity: .85; }
  .header { font: var(--w-semibold) 12px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--fg-2); margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="header">Signal palette — for status & data UI only</div>
  <div class="grid">
    <div class="col">
      <div class="swatch" style="background:var(--hardex-solar); color:var(--hardex-cement-900)">
        <div><div class="name">Solar</div><div class="use">caution · warning</div></div>
        <div class="hex">#FFC529</div>
      </div>
      <div class="swatch" style="background:var(--hardex-solar-soft); color:var(--hardex-cement-800)">
        <div class="name">Solar soft</div><div class="hex">#FFF2C9</div>
      </div>
    </div>
    <div class="col">
      <div class="swatch" style="background:var(--hardex-coral); color:#fff">
        <div><div class="name">Coral</div><div class="use">error · hot</div></div>
        <div class="hex">#FF5A45</div>
      </div>
      <div class="swatch" style="background:var(--hardex-coral-soft); color:var(--hardex-cement-800)">
        <div class="name">Coral soft</div><div class="hex">#FFE1DB</div>
      </div>
    </div>
    <div class="col">
      <div class="swatch" style="background:var(--hardex-sky); color:#fff">
        <div><div class="name">Sky</div><div class="use">info · waterproofing</div></div>
        <div class="hex">#2BB0FF</div>
      </div>
      <div class="swatch" style="background:var(--hardex-sky-soft); color:var(--hardex-cement-800)">
        <div class="name">Sky soft</div><div class="hex">#DCF1FF</div>
      </div>
    </div>
    <div class="col">
      <div class="swatch" style="background:var(--hardex-lime-500); color:var(--hardex-green-900)">
        <div><div class="name">Lime</div><div class="use">accent · "new" · eco flags</div></div>
        <div class="hex">#C5F532</div>
      </div>
      <div class="swatch" style="background:var(--hardex-lime-100); color:var(--hardex-green-900)">
        <div class="name">Lime soft</div><div class="hex">#F2FFCC</div>
      </div>
    </div>
  </div>
</body>
</html>
