<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find a Dealer | Hardex India</title>
  <meta name="description" content="Find authorized Hardex India dealers and distributors near you. Pan-India network.">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="shared-nav"></div>

<div class="page-hero">
  <h1>Find a <em>Dealer</em></h1>
  <p>Authorized dealers and distributors across India. Find one near you.</p>
</div>

<div class="breadcrumb">
  <a href="index.html">Home</a> <span>/</span> Dealer Locator
</div>

<div class="page-section">
  <div class="dealer-search">
    <select id="region-filter"><option value="all">All Regions</option></select>
    <select id="type-filter">
      <option value="all">All Types</option>
      <option value="headquarters">Headquarters</option>
      <option value="distributor">Distributor</option>
      <option value="dealer">Dealer</option>
      <option value="applicator">Applicator</option>
    </select>
    <input type="text" id="dealer-search" placeholder="Search by name or city…">
  </div>
  <p id="dealer-count" style="font-size:13px;color:var(--muted);margin-bottom:24px;"></p>
  <div id="dealer-list"></div>
  <p id="no-dealers" style="display:none;padding:40px 0;color:var(--muted);text-align:center;">No dealers found matching your criteria.</p>
</div>

<div style="background:var(--bg-off);padding:80px 48px;text-align:center;">
  <div style="max-width:700px;margin:0 auto;">
    <h2 style="font-family:var(--font-disp);font-size:44px;letter-spacing:0.02em;margin-bottom:14px;">Become a <em style="font-style:normal;color:var(--teal);">Dealer</em></h2>
    <p style="color:var(--muted);font-size:15px;margin-bottom:32px;">Interested in distributing Hardex products in your region? Join our growing pan-India network.</p>
    <a href="contact.html" class="btn-primary">Apply Now →</a>
  </div>
</div>

<div id="shared-footer"></div>

<script src="config/dealers-data.js"></script>
<script src="config/site-config.js"></script>
<script src="config/products-data.js"></script>
<script src="components/shared-nav.js"></script>
<script>
(function () {
  'use strict';
  if (typeof DEALERS === 'undefined') return;

  var regionSel = document.getElementById('region-filter');
  var typeSel   = document.getElementById('type-filter');
  var searchIn  = document.getElementById('dealer-search');
  var list      = document.getElementById('dealer-list');
  var count     = document.getElementById('dealer-count');
  var none      = document.getElementById('no-dealers');

  if (typeof REGIONS !== 'undefined') {
    REGIONS.forEach(function(r) {
      var o = document.createElement('option');
      o.value = r; o.textContent = r;
      regionSel.appendChild(o);
    });
  }

  function render() {
    var region = regionSel.value;
    var type   = typeSel.value;
    var search = searchIn.value.toLowerCase();

    var filtered = DEALERS.filter(function(d) {
      if (region !== 'all' && d.region !== region) return false;
      if (type !== 'all' && d.type !== type) return false;
      if (search && !d.name.toLowerCase().includes(search) && !d.city.toLowerCase().includes(search)) return false;
      return true;
    });

    count.textContent = filtered.length + ' dealer' + (filtered.length !== 1 ? 's' : '') + ' found';

    if (!filtered.length) { list.innerHTML = ''; none.style.display = 'block'; return; }
    none.style.display = 'none';
    list.innerHTML = filtered.map(function(d) {
      return '<div class="dealer-card">' +
        '<div><div class="dealer-name">' + d.name + '</div>' +
        '<div class="dealer-meta">' + d.address +
        (d.phone ? '<br>☎ ' + d.phone : '') +
        (d.email ? '<br>✉ <a href="mailto:' + d.email + '">' + d.email + '</a>' : '') +
        '</div></div>' +
        '<div><span class="dealer-badge">' + d.type + '</span>' +
        '<div style="font-size:12px;color:var(--muted);margin-top:8px;">' + d.region + '</div></div>' +
        '</div>';
    }).join('');
  }

  regionSel.addEventListener('change', render);
  typeSel.addEventListener('change', render);
  searchIn.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
